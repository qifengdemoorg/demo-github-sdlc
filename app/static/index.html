<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <!-- Vue 3 global build vendored locally keeps the demo dependency-free. -->
  <script src="/static/vendor/vue.global.prod.js"></script>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --border: #e1e4e8;
      --text: #24292f;
      --muted: #6a737d;
      --accent: #0969da;
      --danger: #cf222e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 { font-size: 28px; margin-bottom: 4px; }
    p.subtitle { color: var(--muted); margin-top: 0; }
    form {
      display: flex;
      gap: 8px;
      margin: 24px 0 16px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 15px;
    }
    button {
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    li .title { flex: 1; }
    li.done .title { text-decoration: line-through; color: var(--muted); }
    li .id { color: var(--muted); font-size: 13px; }
    .delete {
      background: transparent;
      color: var(--danger);
      border-color: var(--border);
    }
    .empty { color: var(--muted); text-align: center; padding: 24px; }
    .error { color: var(--danger); min-height: 20px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main id="app">
    <h1>TaskFlow</h1>
    <p class="subtitle">极简任务管理</p>

    <form @submit.prevent="onSubmit">
      <!-- maxlength mirrors TaskCreate.title max_length=200 in app/models.py -->
      <label class="sr-only" for="title">添加新任务</label>
      <input
        type="text"
        id="title"
        v-model="newTitle"
        placeholder="添加新任务…"
        maxlength="200"
        autocomplete="off"
      />
      <button type="submit">添加</button>
    </form>
    <div class="error" role="alert" aria-live="polite">{{ error }}</div>

    <ul>
      <li v-for="task in tasks" :key="task.id" :class="{ done: task.done }">
        <input
          type="checkbox"
          :checked="task.done"
          :aria-label="`标记“${task.title}”为${task.done ? '未完成' : '完成'}`"
          @change="toggleTask(task, $event.target.checked)"
        />
        <span class="title">{{ task.title }}</span>
        <span class="id">#{{ task.id }}</span>
        <button class="delete" @click="deleteTask(task.id)">删除</button>
      </li>
    </ul>
    <p class="empty" v-if="tasks.length === 0">暂无任务，添加一个吧。</p>
  </main>

  <script>
    const { createApp } = Vue;
    const API = "";

    createApp({
      data() {
        return {
          tasks: [],
          newTitle: "",
          error: "",
        };
      },
      methods: {
        async loadTasks() {
          this.error = "";
          try {
            const resp = await fetch(`${API}/tasks`);
            if (!resp.ok) throw new Error("加载任务失败");
            this.tasks = await resp.json();
          } catch (err) {
            this.error = err.message;
          }
        },
        onSubmit() {
          const title = this.newTitle.trim();
          if (!title) {
            this.error = "任务标题不能为空。";
            return;
          }
          this.createTask(title);
          this.newTitle = "";
        },
        async createTask(title) {
          this.error = "";
          try {
            const resp = await fetch(`${API}/tasks`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ title }),
            });
            if (!resp.ok) throw new Error("创建任务失败");
            await this.loadTasks();
          } catch (err) {
            this.error = err.message;
          }
        },
        async toggleTask(task, done) {
          this.error = "";
          try {
            const resp = await fetch(`${API}/tasks/${task.id}`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ done }),
            });
            if (!resp.ok) throw new Error("更新任务失败");
            await this.loadTasks();
          } catch (err) {
            this.error = err.message;
          }
        },
        async deleteTask(id) {
          this.error = "";
          try {
            const resp = await fetch(`${API}/tasks/${id}`, { method: "DELETE" });
            if (!resp.ok) throw new Error("删除任务失败");
            await this.loadTasks();
          } catch (err) {
            this.error = err.message;
          }
        },
      },
      mounted() {
        this.loadTasks();
      },
    }).mount("#app");
  </script>
</body>
</html>
